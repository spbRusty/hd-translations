<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>HD Translations</title>
<link rel="stylesheet" href="assets/style.css?v=5"><script>
(function(){
  var HASH="f8d5b94b925181644ed73cd41afa6bfb5e72c1dfac6168dbda31583ced6c5c90";
  function hex(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
  function block(){
    document.documentElement.innerHTML='<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><title>HD Translations</title></head><body style="margin:0;background:#f6f6f3;color:#202124;font:16px system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh"><div style="text-align:center"><h1 style="font-size:24px;font-weight:600">Доступ закрыт</h1><p style="color:#707070">Откройте сайт по секретной ссылке.</p></div></body>';
    window.HD_ACCESS=false;
  }
  window.HD_ACCESS=false;
  var q=new URLSearchParams(location.search).get("access");
  var ok=false;
  try{ok=sessionStorage.getItem("hd-access")==="1"}catch(e){}
  if(ok){window.HD_ACCESS=true;return}
  if(!q){block();return}
  crypto.subtle.digest("SHA-256",new TextEncoder().encode(q)).then(function(buf){
    if(hex(buf)===HASH){try{sessionStorage.setItem("hd-access","1")}catch(e){}window.HD_ACCESS=true}
    else block();
  }).catch(block);
})();
</script>
<script>
(function(){
  try {
    if (localStorage.getItem('hd-theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  } catch(e) {}
})();
</script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="./">HD Translations</a>
  <div class="header-actions">
    <a class="back" href="./">Все тексты</a>
    <button class="theme-btn" id="theme-toggle" type="button" aria-label="Переключить тему" title="Переключить тему"
      onclick="document.documentElement.classList.toggle('dark');try{localStorage.setItem('hd-theme',document.documentElement.classList.contains('dark')?'dark':'light')}catch(e){}">
      <span class="theme-icon moon" aria-hidden="true"></span>
      <span class="theme-icon sun" aria-hidden="true"></span>
    </button>
  </div>
</header>
<main class="reader-page"><div id="reader"></div></main>
<script src="assets/app.js?v=5"></script>
<script>HD.initReader();</script>
</body>
</html>
