<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>HD Translations</title><link rel="stylesheet" href="assets/style.css?v=5"><script>
(function(){
  var HASH="f8d5b94b925181644ed73cd41afa6bfb5e72c1dfac6168dbda31583ced6c5c90";
  function hex(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
  function block(){
    document.documentElement.innerHTML='<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><title>HD Translations</title></head><body style="margin:0;background:#f6f6f3;color:#202124;font:16px system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh"><div style="text-align:center"><h1 style="font-size:24px;font-weight:600">Доступ закрыт</h1><p style="color:#707070">Откройте сайт по секретной ссылке.</p></div></body>';
    window.HD_ACCESS=false;
  }
  window.HD_ACCESS=false;
  window.HD_READY=(async function(){
    var q=new URLSearchParams(location.search).get("access");
    var ok=false;
    try{ok=sessionStorage.getItem("hd-access")==="1"}catch(e){}
    if(ok){window.HD_ACCESS=true;return true}
    if(!q){block();return false}
    try{
      var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(q));
      if(hex(buf)===HASH){
        try{sessionStorage.setItem("hd-access","1")}catch(e){}
        window.HD_ACCESS=true;
        return true;
      }
    }catch(e){}
    block();
    return false;
  })();
})();
</script></head><body><header class="site-header"><a class="brand" href="./">HD Translations</a><button class="theme-btn" id="theme-toggle" type="button" aria-label="Переключить тему" title="Переключить тему" onclick="HD.toggleTheme()"><span class="theme-icon moon" aria-hidden="true"></span><span class="theme-icon sun" aria-hidden="true"></span></button></header><main class="container"><h1>Тексты</h1><div id="text-list" class="text-list"><div class="loading">Загрузка…</div></div></main><script src="assets/app.js?v=7"></script><script>HD.initIndex();</script></body></html>
